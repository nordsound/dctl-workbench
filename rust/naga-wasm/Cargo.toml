[package]
name = "naga-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for naga shader translator (GLSL to WGSL)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
naga = { version = "28.0", features = ["glsl-in", "wgsl-out"] }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_error_panic_hook"]

[profile.release]
lto = true
opt-level = "z"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
