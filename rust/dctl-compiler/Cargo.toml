[package]
name = "dctl-compiler"
version = "0.2.0"
edition = "2021"
description = "DCTL to WGSL compiler via Naga"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Tree-sitter for parsing (native only, not for WASM)
tree-sitter = { version = "0.26", optional = true }
tree-sitter-dctl = { path = "../tree-sitter-dctl", optional = true }

# Naga for shader IR and WGSL output
naga = { version = "28.0", features = ["wgsl-out"] }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Regex for preprocessor
regex = "1.10"

# Logging (optional, for debugging)
log = "0.4"

# For Naga compat
indexmap = "2.0"
rustc-hash = "1.1"  # Must match naga's version

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
opt-level = "z"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = []
# Enable tree-sitter parser (native builds only)
native-parser = ["dep:tree-sitter", "dep:tree-sitter-dctl"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true
