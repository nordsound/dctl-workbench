<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clip">
      <rect width="512" height="512" rx="88"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="#16161e"/>
  <!-- Three diagonal color bars: warm → cool, representing color transformation -->
  <g clip-path="url(#clip)">
    <g transform="rotate(-15, 256, 256)">
      <rect x="88" y="64" width="72" height="384" rx="36" fill="#FF6B6B"/>
      <rect x="220" y="64" width="72" height="384" rx="36" fill="#A78BFA"/>
      <rect x="352" y="64" width="72" height="384" rx="36" fill="#38BDF8"/>
    </g>
  </g>
</svg>
